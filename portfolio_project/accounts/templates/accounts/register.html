{% extends "portfolio/base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2 class="auth-title">

            Registo

        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">

                Registar

            </button>

        </form>

        <div class="auth-link">

            Já tens conta?

            <a href="/login/">

                Fazer login

            </a>

        </div>

    </div>

</div>

{% endblock %}
