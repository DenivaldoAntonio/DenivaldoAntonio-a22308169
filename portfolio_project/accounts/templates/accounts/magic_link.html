{% extends 'portfolio/base.html' %}

{% block content %}

<div class="auth-container">

<div class="auth-card">

<h2 class="auth-title">
Login Mágico
</h2>

<form method="POST">

{% csrf_token %}

<input
    type="email"
    name="email"
    placeholder="Email"
    required
>

<button type="submit" class="auth-btn">
Enviar Link
</button>

</form>

</div>

</div>

{% endblock %}
